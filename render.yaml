projects:
  - name: restaurantos
    environments:
      - name: production
        services:
          - type: web
            name: restaurantos-web
            runtime: docker
            dockerfilePath: ./Dockerfile
            dockerContext: .
            region: frankfurt
            plan: free
            numInstances: 1
            autoDeployTrigger: checksPass
            healthCheckPath: /health/
            dockerCommand: python scripts/render_start.py
            envVars:
              - key: DJANGO_SETTINGS_MODULE
                value: config.production
              - key: SECRET_KEY
                generateValue: true
              - key: DATABASE_URL
                sync: false
              - key: DATABASE_URL_UNPOOLED
                sync: false
              - key: ALLOWED_HOSTS
                value: localhost,127.0.0.1
              - key: REQUIRE_NOTIFICATION_WORKER
                value: "false"
              - key: SERVE_LOCAL_MEDIA
                value: "true"
              - key: WEB_CONCURRENCY
                value: "1"
              - key: GUNICORN_THREADS
                value: "4"
              - key: FORWARDED_ALLOW_IPS
                value: "*"
