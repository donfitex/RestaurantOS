[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [".local", "*/migrations/*"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"config/*.py" = ["F403", "F405"]

[tool.coverage.run]
source = ["apps"]
omit = ["*/migrations/*", "*/tests.py", "*/test_*.py"]

[tool.coverage.report]
show_missing = true
skip_empty = true
