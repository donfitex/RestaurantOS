      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - in: query
        name: role
        schema:
          type: string
          enum:
          - ADMIN
          - CASHIER
          - CUSTOMER
          - INVENTORY_MANAGER
          - KITCHEN
          - MANAGER
          - WAITER
        description: |-
          * `ADMIN` - Administrator
          * `MANAGER` - Manager
          * `CASHIER` - Cashier
          * `WAITER` - Waiter
          * `KITCHEN` - Kitchen
          * `INVENTORY_MANAGER` - Inventory manager
          * `CUSTOMER` - Customer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      tags:
      - v1
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedStaffList'
          description: ''
