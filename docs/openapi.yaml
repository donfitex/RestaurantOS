openapi: 3.0.3
info:
  title: RestaurantOS API
  version: 1.0.0
  description: Branch-scoped restaurant operations. Session authentication and CSRF
    are required for unsafe requests. Payments record staff-verified transactions.
paths:
  /api/v1/auth/customers/:
    get:
      operationId: v1_auth_customers_list
      parameters:
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      tags:
      - v1
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedProfileList'
          description: ''
  /api/v1/auth/customers/{id}/:
    get:
      operationId: v1_auth_customers_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this user.
