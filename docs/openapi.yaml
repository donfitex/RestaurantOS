components:
  schemas:
    AdjustmentKindEnum:
      enum:
      - ADJUSTMENT
      - WASTE
      type: string
      description: |-
        * `ADJUSTMENT` - ADJUSTMENT
        * `WASTE` - WASTE
    AdjustmentRequest:
      type: object
      properties:
        inventory_item:
          type: integer
          minimum: 1
        quantity:
          type: string
          format: decimal
          pattern: ^-?\d{0,11}(?:\.\d{0,3})?$
        kind:
          allOf:
          - $ref: '#/components/schemas/AdjustmentKindEnum'
          default: ADJUSTMENT
        notes:
          type: string
          minLength: 1
          maxLength: 2000
        reference:
          type: string
          maxLength: 120
      required:
      - inventory_item
      - notes
      - quantity
    Branch:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        restaurant:
          type: integer
        name:
          type: string
          maxLength: 160
        address:
          type: string
        phone:
          type: string
          maxLength: 32
        tax_rate:
          type: string
          format: decimal
          pattern: ^-?\d{0,1}(?:\.\d{0,4})?$
        operating_hours:
          type: array
          items:
            $ref: '#/components/schemas/Hours'
          readOnly: true
      required:
      - id
      - name
      - operating_hours
      - restaurant
    Category:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        restaurant:
          type: integer
        name:
          type: string
          maxLength: 100
        description:
          type: string
      required:
      - id
      - name
      - restaurant
    Hours:
      type: object
      properties:
        weekday:
          type: integer
          maximum: 6
          minimum: 0
        opens_at:
          type: string
          format: time
        closes_at:
          type: string
          format: time
      required:
      - closes_at
      - opens_at
      - weekday
    Inventory:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        branch:
          type: integer
          readOnly: true
        ingredient:
          type: integer
          readOnly: true
        ingredient_name:
          type: string
          readOnly: true
        unit:
          type: string
          readOnly: true
        quantity:
          type: string
          format: decimal
          pattern: ^-?\d{0,11}(?:\.\d{0,3})?$
          readOnly: true
        minimum_stock:
          type: string
          format: decimal
          pattern: ^-?\d{0,11}(?:\.\d{0,3})?$
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - branch
      - id
      - ingredient
      - ingredient_name
      - minimum_stock
      - quantity
      - unit
      - updated_at
    LoginInputRequest:
      type: object
      properties:
        username:
          type: string
          minLength: 1
        password:
          type: string
          writeOnly: true
          minLength: 1
      required:
      - password
      - username
    MenuItem:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        branch:
          type: integer
        category:
          type: integer
        category_name:
          type: string
          readOnly: true
        name:
          type: string
          maxLength: 160
        description:
          type: string
        price:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
        image:
          type: string
          format: uri
          nullable: true
        sku:
          type: string
          maxLength: 64
        availability:
          type: boolean
        preparation_time:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
        modifiers:
          type: array
          items:
            $ref: '#/components/schemas/Modifier'
          readOnly: true
      required:
      - branch
      - category
      - category_name
      - id
      - modifiers
      - name
      - price
      - sku
    MethodEnum:
      enum:
      - CASH
      - CARD
      - TRANSFER
      - ONLINE
      - OTHER
      type: string
      description: |-
        * `CASH` - Cash
        * `CARD` - Card
        * `TRANSFER` - Transfer
        * `ONLINE` - Online
        * `OTHER` - Other
    Modifier:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 100
        price:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
      required:
      - id
      - name
    Movement:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        inventory_item:
          type: integer
          readOnly: true
        kind:
          allOf:
          - $ref: '#/components/schemas/MovementKindEnum'
          readOnly: true
        quantity:
          type: string
          format: decimal
          pattern: ^-?\d{0,11}(?:\.\d{0,3})?$
          readOnly: true
        balance_after:
          type: string
          format: decimal
          pattern: ^-?\d{0,11}(?:\.\d{0,3})?$
          readOnly: true
        order:
          type: integer
          readOnly: true
          nullable: true
        actor:
          type: integer
          readOnly: true
          nullable: true
        reference:
          type: string
          readOnly: true
        notes:
          type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - actor
      - balance_after
      - created_at
      - id
      - inventory_item
      - kind
      - notes
      - order
      - quantity
      - reference
    MovementKindEnum:
      enum:
      - PURCHASE
      - SALE
      - WASTE
      - ADJUSTMENT
      - RETURN
      - TRANSFER
      type: string
      description: |-
        * `PURCHASE` - Purchase
        * `SALE` - Sale
        * `WASTE` - Waste
        * `ADJUSTMENT` - Adjustment
        * `RETURN` - Return
        * `TRANSFER` - Transfer
    Order:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        branch:
          type: integer
          readOnly: true
        customer:
          type: integer
          readOnly: true
        table:
          type: integer
          readOnly: true
          nullable: true
        order_type:
          allOf:
          - $ref: '#/components/schemas/OrderTypeEnum'
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/OrderStatusEnum'
          readOnly: true
        subtotal:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,2})?$
          readOnly: true
        tax:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,2})?$
          readOnly: true
        discount:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,2})?$
          readOnly: true
        total:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,2})?$
          readOnly: true
        currency:
          type: string
          readOnly: true
        notes:
          type: string
          readOnly: true
        delivery_address:
          type: string
          readOnly: true
        request_key:
          type: string
          format: uuid
          readOnly: true
        priority:
          type: integer
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        confirmed_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        preparing_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        ready_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        completed_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        items:
          type: array
          items:
            $ref: '#/components/schemas/OrderItem'
          readOnly: true
      required:
      - branch
      - completed_at
      - confirmed_at
      - created_at
      - currency
      - customer
      - delivery_address
      - discount
      - id
      - items
      - notes
      - order_type
      - preparing_at
      - priority
      - ready_at
      - request_key
      - status
      - subtotal
      - table
      - tax
      - total
    OrderCreateRequest:
      type: object
      properties:
        branch:
          type: integer
        table:
          type: integer
          nullable: true
        order_type:
          allOf:
          - $ref: '#/components/schemas/OrderTypeEnum'
          default: TAKEAWAY
        items:
          type: array
          items:
            $ref: '#/components/schemas/OrderLineInputRequest'
        notes:
          type: string
          maxLength: 5000
        delivery_address:
          type: string
          maxLength: 2000
        discount:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,2})?$
        request_key:
          type: string
          format: uuid
      required:
      - branch
      - items
    OrderItem:
      type: object
      properties:
        id:
          type: integer
